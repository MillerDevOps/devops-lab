# =====================================================================
# python-api | Pipeline CI/CD con GitHub Actions + GitOps (ArgoCD)
# Solo se ejecuta si cambia apps/python-api (filtro por ruta en monorepo)
# =====================================================================
name: python-api CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/python-api/**"
      - ".github/workflows/python-api.yml"
  pull_request:
    paths:
      - "apps/python-api/**"
  workflow_dispatch:

permissions:
  contents: write   # para hacer commit en gitops/
  packages: write   # para publicar en ghcr.io

env:
  IMAGE: ghcr.io/millerdevops/python-api
  APP_DIR: apps/python-api

concurrency:
  group: python-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------- Integración continua (también corre en Pull Requests)
  ci:
    name: CI - Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/python-api/requirements*.txt

      - name: Install Dependencies
        run: pip install -r $APP_DIR/requirements-dev.txt

      - name: Lint
        run: ruff check $APP_DIR

      - name: Unit Tests
        working-directory: apps/python-api
        run: python -m pytest -v

  # ---------------- Entrega continua (solo en push a main)
  cd:
    name: CD - Imagen, escaneo y GitOps
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}   # se lo pasa al job de despliegue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir versión (hash del commit)
        id: version
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: docker build --build-arg APP_VERSION=$TAG -t $IMAGE:$TAG $APP_DIR

      - name: Image Scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed \
            $IMAGE:$TAG

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        run: docker push $IMAGE:$TAG

      - name: Update GitOps (ArgoCD despliega a partir de aquí)
        run: |
          sed -i 's/newTag: .*/newTag: "'$TAG'"/' gitops/python-api/kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/python-api/kustomization.yaml
          git commit -m "deploy(python-api): $TAG [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  # ---------------- Despliegue en el VPS con Docker (modelo PUSH por SSH)
  # GitHub Actions entra al servidor, descarga la imagen nueva y recrea el contenedor.
  # (En Kubernetes lo hará ArgoCD con el modelo PULL.)
  deploy-vps:
    name: Deploy - VPS (Docker)
    needs: cd
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Preparar llave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Validar que los secretos existan (si no, GitHub los entrega vacíos)
          [ -n "$VPS_HOST" ] || { echo "::error::Falta el secreto VPS_HOST"; exit 1; }
          [ -n "$SSH_KEY" ]  || { echo "::error::Falta el secreto VPS_SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo ">> Obteniendo la huella SSH de $VPS_HOST"
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts \
            || { echo "::error::No se pudo conectar por SSH al puerto 22 de $VPS_HOST"; exit 1; }

      - name: Desplegar contenedor y verificar (smoke test)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TAG: ${{ needs.cd.outputs.tag }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -e
          IMAGE=ghcr.io/millerdevops/python-api:$TAG
          echo ">> Descargando \$IMAGE"
          docker pull \$IMAGE
          echo ">> Recreando el contenedor"
          docker rm -f py 2>/dev/null || true
          docker run -d --name py --restart unless-stopped -p 8000:8000 \$IMAGE
          echo ">> Smoke test: esperando a que la app responda"
          for i in \$(seq 1 15); do
            if curl -fsS localhost:8000/health/ready > /dev/null; then
              echo ">> OK: versión $TAG desplegada y respondiendo"
              curl -s localhost:8000/api/info; echo
              exit 0
            fi
            sleep 2
          done
          echo ">> ERROR: la app no respondió"
          docker logs py --tail 50
          exit 1
          EOF