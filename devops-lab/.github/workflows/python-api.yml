# =====================================================================
# python-api | Pipeline CI/CD con GitHub Actions + GitOps (ArgoCD)
# Solo se ejecuta si cambia apps/python-api (filtro por ruta en monorepo)
# =====================================================================
name: python-api CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/python-api/**"
      - ".github/workflows/python-api.yml"
  pull_request:
    paths:
      - "apps/python-api/**"
  workflow_dispatch:

permissions:
  contents: write   # para hacer commit en gitops/
  packages: write   # para publicar en ghcr.io

env:
  IMAGE: ghcr.io/millerdevops/python-api
  APP_DIR: apps/python-api

concurrency:
  group: python-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------- Integración continua (también corre en Pull Requests)
  ci:
    name: CI - Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/python-api/requirements*.txt

      - name: Install Dependencies
        run: pip install -r $APP_DIR/requirements-dev.txt

      - name: Lint
        run: ruff check $APP_DIR

      - name: Unit Tests
        working-directory: apps/python-api
        run: python -m pytest -v

  # ---------------- Entrega continua (solo en push a main)
  cd:
    name: CD - Imagen, escaneo y GitOps
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir versión (hash del commit)
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: docker build --build-arg APP_VERSION=$TAG -t $IMAGE:$TAG $APP_DIR

      - name: Image Scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed \
            $IMAGE:$TAG

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        run: docker push $IMAGE:$TAG

      - name: Update GitOps (ArgoCD despliega a partir de aquí)
        run: |
          sed -i 's/newTag: .*/newTag: "'$TAG'"/' gitops/python-api/kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/python-api/kustomization.yaml
          git commit -m "deploy(python-api): $TAG [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
